<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX Anatomy Viewer</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #info { 
            position: absolute; top: 20px; left: 20px; color: #0f0; z-index: 100; 
            background: rgba(0,0,0,0.85); padding: 20px; border-left: 4px solid #0f0;
            box-shadow: 0 0 20px rgba(0,255,0,0.2);
            pointer-events: none;
        }
        .title { font-weight: bold; font-size: 1.4em; letter-spacing: 2px; margin-bottom: 10px; display: block; }
        .stat { color: #666; font-size: 0.85em; text-transform: uppercase; }
        .val { color: #fff; font-family: monospace; font-size: 1.1em; }
    </style>
</head>
<body>
    <div id="info">
        <span class="title">APEX :: ANATOMY</span>
        <span class="stat">Target:</span> <span class="val">human_skeleton.glb</span><br>
        <span class="stat">Status:</span> <span id="status" class="val" style="color: #0f0;">Ready</span><br>
        <span class="stat">Nodes:</span> <span id="nodeCount" class="val">0</span>
    </div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(2, 2, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Environment
        const grid = new THREE.GridHelper(20, 20, 0x00ff00, 0x111111);
        scene.add(grid);
        
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const spotLight = new THREE.SpotLight(0xffffff, 200);
        spotLight.position.set(5, 10, 5);
        scene.add(spotLight);

        // Loader
        const loader = new GLTFLoader();
        // Unified path logic for local dev and GitHub Pages
        const glbPath = window.location.pathname.endsWith('viewer.html') ? '../human_skeleton.glb' : './human_skeleton.glb';
        
        loader.load(glbPath, (gltf) => {
            const model = gltf.scene;
            scene.add(model);
            model.updateMatrixWorld(true);

            // Discovery Phase (Non-recursive)
            const apexNodes = [];
            model.traverse(node => {
                if (node.isObject3D && node.name.startsWith("APEX_NODE_")) {
                    apexNodes.push(node);
                }
            });

            document.getElementById('nodeCount').innerText = apexNodes.length;

            // Geometry Phase
            const jointGeom = new THREE.SphereGeometry(0.02, 16, 16);
            const terminalGeom = new THREE.SphereGeometry(0.03, 16, 16);
            const jointMat = new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x004400 });
            const terminalMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x440000 });
            const boneMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8, roughness: 0.2 });

            apexNodes.forEach(node => {
                // Marker
                const isTerminal = node.children.filter(c => c.name.startsWith("APEX_NODE_")).length === 0;
                const marker = new THREE.Mesh(isTerminal ? terminalGeom : jointGeom, isTerminal ? terminalMat : jointMat);
                node.add(marker);

                // Connector
                const biologicalChildren = node.children.filter(c => c.name && c.name.startsWith("APEX_NODE_"));
                biologicalChildren.forEach(child => {
                    const start = new THREE.Vector3(0,0,0);
                    const end = child.position.clone();
                    const dir = end.clone().sub(start);
                    const len = dir.length();

                    if (len > 0) {
                        const boneGeom = new THREE.CylinderGeometry(0.008, 0.02, len, 8);
                        boneGeom.translate(0, len / 2, 0);
                        const bone = new THREE.Mesh(boneGeom, boneMat);
                        bone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
                        node.add(bone);
                    }
                });
            });

            // Center camera
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            controls.target.set(center.x, center.y, center.z);
            controls.update();

        }, undefined, (err) => {
            document.getElementById('status').innerText = "FAIL";
            document.getElementById('status').style.color = "#f00";
            console.error(err);
        });

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
