<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX Anatomical Atlas</title>
    <style>
        body { margin: 0; background: #080808; overflow: hidden; font-family: 'Inter', sans-serif; color: #fff; }
        #info { 
            position: absolute; top: 20px; left: 20px; z-index: 100; 
            background: rgba(15,15,15,0.95); padding: 25px; border-radius: 4px;
            border-left: 4px solid #0f0; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px); pointer-events: none;
        }
        .title { font-weight: 800; font-size: 1.2em; letter-spacing: 3px; color: #0f0; margin-bottom: 15px; display: block; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .row { margin-bottom: 8px; display: flex; justify-content: space-between; width: 220px; }
        .label { color: #888; font-size: 0.75em; text-transform: uppercase; font-weight: 600; }
        .val { color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 0.9em; }
        #hot-indicator { 
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            background: #0f0; margin-right: 12px; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0.3; transform: scale(0.8); } }
    </style>
</head>
<body>
    <div id="info">
        <span class="title"><span id="hot-indicator"></span>APEX ATLAS</span>
        <div class="row"><span class="label">Bones</span><span id="boneCount" class="val">0</span></div>
        <div class="row"><span class="label">Muscles</span><span id="muscles" class="val" style="color: #f44;">0</span></div>
        <div class="row"><span class="label">Nerves</span><span id="nerves" class="val" style="color: #44f;">0</span></div>
        <div class="row"><span class="label">Organs</span><span id="organs" class="val" style="color: #f6f;">0</span></div>
        <div class="row"><span class="label">Integument</span><span id="skin" class="val" style="color: #6cf;">0</span></div>
        <div class="row" style="margin-top: 10px;"><span class="label">System Status</span><span id="status" class="val">SYNCED</span></div>
    </div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.FogExp2(0x0a0a0a, 0.15);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(2, 1.5, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.GridHelper(10, 20, 0x111111, 0x050505));
        
        // Studio Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.2));
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
        keyLight.position.set(5, 10, 5);
        scene.add(keyLight);
        
        const rimLight = new THREE.PointLight(0x66ccff, 2, 10);
        rimLight.position.set(-5, 2, -5);
        scene.add(rimLight);

        const loader = new GLTFLoader();
        const visualGroup = new THREE.Group();
        scene.add(visualGroup);

        // Medical Materials
        const boneMat = new THREE.MeshStandardMaterial({ color: 0xe8e4d8, roughness: 0.8, metalness: 0.0 });
        const muscleMat = new THREE.MeshStandardMaterial({ color: 0xaa1111, roughness: 0.6, emissive: 0x220000 });
        const neuralMat = new THREE.MeshStandardMaterial({ color: 0x2244ff, emissive: 0x000044, transparent: true, opacity: 0.7 });
        const organMat = new THREE.MeshStandardMaterial({ color: 0xff33aa, emissive: 0x220011, roughness: 0.3 });
        
        // High-End Physical Skin
        const skinMat = new THREE.MeshPhysicalMaterial({ 
            color: 0xadd8e6, 
            transparent: true, 
            opacity: 0.18,
            transmission: 0.2,
            thickness: 0.5,
            roughness: 0.2,
            metalness: 0.1,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1
        });
        
        const jointMarkerMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });

        const baseCylinder = new THREE.CylinderGeometry(0.005, 0.005, 1, 6);
        baseCylinder.translate(0, 0.5, 0);

        function getGlbPath() {
            const loc = window.location;
            if (loc.hostname.includes('localhost') || loc.hostname.includes('0.0.0.0')) {
                return loc.pathname.includes('/examples/') ? '../human_skeleton.glb' : './human_skeleton.glb';
            }
            return 'human_skeleton.glb';
        }

        function createPrimitive(shapeData, material) {
            let geom;
            switch(shapeData.type) {
                case 'sphere':
                    geom = new THREE.SphereGeometry(shapeData.radius, 32, 32);
                    break;
                case 'box':
                    geom = new THREE.BoxGeometry(shapeData.width, shapeData.height, shapeData.depth);
                    break;
                case 'capsule':
                    // radius, length, capSubdivisions, radialSegments
                    geom = new THREE.CapsuleGeometry(shapeData.radius, shapeData.length, 8, 16);
                    break;
                case 'cylinder':
                    geom = new THREE.CylinderGeometry(shapeData.radius, shapeData.radius, shapeData.length, 16);
                    break;
                default:
                    geom = new THREE.SphereGeometry(0.02, 8, 8);
            }
            return new THREE.Mesh(geom, material);
        }

        async function loadModel() {
            loader.load(getGlbPath() + '?t=' + Date.now(), (gltf) => {
                visualGroup.clear();
                const nodeMap = new Map();
                let bCnt = 0, cCnt = 0;

                gltf.scene.traverse(n => {
                    if (n.name.startsWith("APEX_NODE_")) {
                        const name = n.name.replace("APEX_NODE_", "");
                        nodeMap.set(name, n);
                        
                        if (name.startsWith("CPG_")) {
                            cCnt++;
                            const m = new THREE.Mesh(new THREE.SphereGeometry(0.015, 8, 8), neuralMat);
                            m.position.copy(n.position);
                            visualGroup.add(m);
                        } else if (!name.startsWith("MUSCLE_NODE_") && !name.startsWith("SKIN_HULL_") && !name.startsWith("ORGAN_NODE_")) {
                            bCnt++;
                            const m = new THREE.Mesh(new THREE.SphereGeometry(0.006, 6, 6), jointMarkerMat);
                            m.position.copy(n.position);
                            visualGroup.add(m);
                        }
                    }
                });

                document.getElementById('boneCount').innerText = bCnt;
                document.getElementById('nerves').innerText = cCnt;

                const links = gltf.scene.userData.links || [];
                let mCnt = 0, sCnt = 0, oCnt = 0;

                links.forEach(link => {
                    const s = nodeMap.get(link.source);
                    const t = nodeMap.get(link.target);
                    if (s && t) {
                        const dir = t.position.clone().sub(s.position);
                        const len = dir.length();
                        
                        if (link.type === "skin" || link.type === "visceral") {
                            const shapeData = t.userData.shape;
                            if (shapeData) {
                                const mesh = createPrimitive(shapeData, link.type === "skin" ? skinMat : organMat);
                                mesh.position.copy(t.position);
                                if (shapeData.type === 'capsule' || shapeData.type === 'cylinder') {
                                    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
                                }
                                visualGroup.add(mesh);
                                if (link.type === "skin") sCnt++; else oCnt++;
                            }
                        } else if (len > 0) {
                            let mat = boneMat;
                            let scale = 1.0;
                            if (link.type === "muscle") { mat = muscleMat; scale = 0.8; mCnt++; }
                            else if (link.type === "synapse") { mat = neuralMat; scale = 0.4; }

                            const mesh = new THREE.Mesh(baseCylinder, mat);
                            mesh.position.copy(s.position);
                            mesh.scale.set(scale, len, scale);
                            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
                            visualGroup.add(mesh);
                        }
                    }
                });

                document.getElementById('muscles').innerText = mCnt;
                document.getElementById('skin').innerText = sCnt;
                document.getElementById('organs').innerText = oCnt;
                document.getElementById('status').innerText = "LIVE";

            }, undefined, e => {
                document.getElementById('status').innerText = "ERROR";
                console.error(e);
            });
        }

        loadModel();
        setInterval(loadModel, 3000);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
