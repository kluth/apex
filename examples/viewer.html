<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX High-Fidelity Organism</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #info { 
            position: absolute; top: 20px; left: 20px; color: #0f0; z-index: 100; 
            background: rgba(0,0,0,0.85); padding: 20px; border-left: 4px solid #0f0;
            box-shadow: 0 0 20px rgba(0,255,0,0.2);
            pointer-events: none;
        }
        .title { font-weight: bold; font-size: 1.4em; letter-spacing: 2px; margin-bottom: 10px; display: block; }
        .stat { color: #666; font-size: 0.85em; text-transform: uppercase; }
        .val { color: #fff; font-family: monospace; font-size: 1.1em; }
        #hot-indicator { 
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            background: #0f0; margin-right: 10px; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        .muscle-val { color: #f44; }
        .neural-val { color: #44f; }
        .sensory-val { color: #f4f; }
    </style>
</head>
<body>
    <div id="info">
        <span class="title"><span id="hot-indicator"></span>APEX :: SENTIENT</span>
        <span class="stat">Target:</span> <span class="val">human_skeleton.glb</span><br>
        <span class="stat">Status:</span> <span id="status" class="val" style="color: #0f0;">Syncing</span><br>
        <span class="stat">Bones:</span> <span id="points" class="val">0</span><br>
        <span class="stat">Muscles:</span> <span id="muscles" class="val muscle-val">0</span><br>
        <span class="stat">Synapses:</span> <span id="synapses" class="val neural-val">0</span><br>
        <span class="stat">Sensors:</span> <span id="sensors" class="val sensory-val">0</span>
    </div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(2, 2, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.GridHelper(10, 10, 0x00ff00, 0x111111));
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const spotLight = new THREE.SpotLight(0xffffff, 200);
        spotLight.position.set(5, 10, 5);
        scene.add(spotLight);

        const loader = new GLTFLoader();
        let currentModel = null;
        let visualGroup = new THREE.Group();
        scene.add(visualGroup);

        const jointGeom = new THREE.SphereGeometry(0.012, 8, 8);
        const cpgGeom = new THREE.SphereGeometry(0.02, 12, 12);
        const boneMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.5 });
        const muscleMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x330000 });
        const neuralMat = new THREE.MeshStandardMaterial({ color: 0x4444ff, emissive: 0x000033, transparent: true, opacity: 0.5 });
        const sensoryMat = new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0x330033, transparent: true, opacity: 0.4 });
        const cpgMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0x333300 });
        const jointMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });

        const baseCylinderGeom = new THREE.CylinderGeometry(0.008, 0.012, 1, 6);
        baseCylinderGeom.translate(0, 0.5, 0);

        async function loadModel() {
            const isDeployed = window.location.hostname.includes('github.io');
            const glbPath = isDeployed 
                ? './human_skeleton.glb?t=' + Date.now()
                : '../human_skeleton.glb?t=' + Date.now();
            
            loader.load(glbPath, (gltf) => {
                while(visualGroup.children.length > 0) {
                    visualGroup.remove(visualGroup.children[0]);
                }
                if (currentModel) scene.remove(currentModel);

                currentModel = gltf.scene;
                scene.add(currentModel);
                currentModel.updateMatrixWorld(true);

                const nodeMap = new Map();
                currentModel.traverse(n => {
                    if (n.isObject3D && n.name.startsWith("APEX_NODE_")) {
                        const name = n.name.replace("APEX_NODE_", "");
                        nodeMap.set(name, n);
                    }
                });

                document.getElementById('points').innerText = nodeMap.size;
                document.getElementById('status').innerText = "OK";
                document.getElementById('status').style.color = "#0f0";

                const sceneData = gltf.scene.userData;
                let muscleCount = 0;
                let synapseCount = 0;
                let sensorCount = 0;

                if (sceneData && sceneData.links) {
                    sceneData.links.forEach(link => {
                        const sourceNode = nodeMap.get(link.source);
                        const targetNode = nodeMap.get(link.target);
                        
                        if (sourceNode && targetNode) {
                            const sPos = new THREE.Vector3();
                            const tPos = new THREE.Vector3();
                            sourceNode.getWorldPosition(sPos);
                            targetNode.getWorldPosition(tPos);

                            const dir = tPos.clone().sub(sPos);
                            const len = dir.length();
                            
                            if (len > 0) {
                                let mat = boneMat;
                                let scale = 1;
                                if (link.type === "muscle") {
                                    mat = muscleMat;
                                    scale = 0.8;
                                    muscleCount++;
                                } else if (link.type === "synapse") {
                                    mat = neuralMat;
                                    scale = 0.4;
                                    synapseCount++;
                                } else if (link.type === "feedback") {
                                    mat = sensoryMat;
                                    scale = 0.3;
                                    sensorCount++;
                                }

                                const mesh = new THREE.Mesh(baseCylinderGeom, mat);
                                mesh.position.copy(sPos);
                                mesh.scale.set(scale, len, scale);
                                mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
                                visualGroup.add(mesh);
                            }
                        }
                    });
                }
                document.getElementById('muscles').innerText = muscleCount;
                document.getElementById('synapses').innerText = synapseCount;
                document.getElementById('sensors').innerText = sensorCount;

                nodeMap.forEach((node, name) => {
                    const worldPos = new THREE.Vector3();
                    node.getWorldPosition(worldPos);
                    
                    if (name.startsWith("CPG_")) {
                        const marker = new THREE.Mesh(cpgGeom, cpgMat);
                        marker.position.copy(worldPos);
                        visualGroup.add(marker);
                    } else if (name.startsWith("MUSCLE_NODE_")) {
                        // Tiny point for muscle center
                    } else {
                        const marker = new THREE.Mesh(jointGeom, jointMat);
                        marker.position.copy(worldPos);
                        visualGroup.add(marker);
                    }
                });

            }, undefined, (e) => {
                document.getElementById('status').innerText = "WAITING";
                document.getElementById('status').style.color = "#ff0";
            });
        }

        loadModel();
        setInterval(loadModel, 2000);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
