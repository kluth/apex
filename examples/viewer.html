<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX Organism Viewer</title>
    <style>
        body { margin: 0; background: #111; overflow: hidden; font-family: monospace; }
        #info { position: absolute; top: 10px; left: 10px; color: #0f0; pointer-events: none; z-index: 10; }
    </style>
</head>
<body>
    <div id="info">APEX 3D VIEWER: human_skeleton.glb</div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Setup Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 2, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting
        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // 3. Grid Helper
        const gridHelper = new THREE.GridHelper(10, 10, 0x00ff00, 0x444444);
        scene.add(gridHelper);

        // 4. Load APEX Model
        const loader = new GLTFLoader();
        loader.load('../human_skeleton.glb', (gltf) => {
            const model = gltf.scene;
            
            // Reconstruct visuals
            const nodes = [];
            model.traverse((node) => {
                if (node.isObject3D && node.name.startsWith("Bone_")) {
                    nodes.push(node);
                }
            });

            nodes.forEach((node) => {
                // Visualize Node as a Sphere
                const sphereGeom = new THREE.SphereGeometry(0.04);
                const sphereMat = new THREE.MeshStandardMaterial({ 
                    color: node.children.length > 0 ? 0x00ff00 : 0xff0000,
                    emissive: 0x002200
                });
                const sphere = new THREE.Mesh(sphereGeom, sphereMat);
                node.add(sphere);

                // Visualize connection to children as Cylinders
                node.children.forEach(child => {
                    if (child.name.startsWith("Bone_")) {
                        const start = new THREE.Vector3(0, 0, 0);
                        const end = child.position.clone();
                        const direction = end.clone().sub(start);
                        const length = direction.length();
                        
                        if (length > 0) {
                            const cylinderGeom = new THREE.CylinderGeometry(0.015, 0.01, length, 8);
                            cylinderGeom.translate(0, length / 2, 0);
                            const cylinderMat = new THREE.MeshStandardMaterial({ 
                                color: 0x888888,
                                roughness: 0.1,
                                metalness: 0.5
                            });
                            const cylinder = new THREE.Mesh(cylinderGeom, cylinderMat);
                            
                            // Orient cylinder toward child
                            cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.clone().normalize());
                            node.add(cylinder);
                        }
                    }
                });
            });

            scene.add(model);
            console.log('APEX Human Model Loaded');
        }, undefined, (error) => {
            console.error('Error loading APEX model:', error);
        });

        // 5. Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1, 0);
        controls.update();

        // 6. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
