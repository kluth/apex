<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX High-Fidelity Organism</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #info { 
            position: absolute; top: 20px; left: 20px; color: #0f0; z-index: 100; 
            background: rgba(0,0,0,0.85); padding: 20px; border-left: 4px solid #0f0;
            box-shadow: 0 0 20px rgba(0,255,0,0.2);
            pointer-events: none;
        }
        .title { font-weight: bold; font-size: 1.4em; letter-spacing: 2px; margin-bottom: 10px; display: block; }
        .stat { color: #666; font-size: 0.85em; text-transform: uppercase; }
        .val { color: #fff; font-family: monospace; font-size: 1.1em; }
        #hot-indicator { 
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            background: #0f0; margin-right: 10px; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
        .muscle-val { color: #f44; }
        .neural-val { color: #44f; }
        .sensory-val { color: #f4f; }
        .skin-val { color: #aaf; }
    </style>
</head>
<body>
    <div id="info">
        <span class="title"><span id="hot-indicator"></span>APEX :: TOTAL FIDELITY</span>
        <span class="stat">Bones:</span> <span id="boneCount" class="val">0</span> / 206<br>
        <span class="stat">Muscles:</span> <span id="muscles" class="val muscle-val">0</span><br>
        <span class="stat">Nerves:</span> <span id="nerves" class="val neural-val">0</span><br>
        <span class="stat">Skin:</span> <span id="skin" class="val skin-val">0</span>
    </div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(2, 2, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.GridHelper(10, 10, 0x00ff00, 0x111111));
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const spotLight = new THREE.SpotLight(0xffffff, 200);
        spotLight.position.set(5, 10, 5);
        scene.add(spotLight);

        const loader = new GLTFLoader();
        let currentModel = null;
        let visualGroup = new THREE.Group();
        scene.add(visualGroup);

        const boneMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.5 });
        const muscleMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x330000 });
        const neuralMat = new THREE.MeshStandardMaterial({ color: 0x4444ff, emissive: 0x000033, transparent: true, opacity: 0.4 });
        const skinMat = new THREE.MeshStandardMaterial({ color: 0x66ccff, transparent: true, opacity: 0.15, wireframe: false });
        const jointMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });

        const baseCylinderGeom = new THREE.CylinderGeometry(0.008, 0.012, 1, 6);
        baseCylinderGeom.translate(0, 0.5, 0);

        const baseSphereGeom = new THREE.SphereGeometry(1, 12, 12);

        async function loadModel() {
            const isDeployed = window.location.hostname.includes('github.io');
            const glbPath = isDeployed 
                ? './human_skeleton.glb?t=' + Date.now()
                : '../human_skeleton.glb?t=' + Date.now();
            
            loader.load(glbPath, (gltf) => {
                while(visualGroup.children.length > 0) {
                    visualGroup.remove(visualGroup.children[0]);
                }
                if (currentModel) scene.remove(currentModel);

                currentModel = gltf.scene;
                scene.add(currentModel);
                currentModel.updateMatrixWorld(true);

                const nodeMap = new Map();
                let boneCnt = 0;
                let cpgCnt = 0;

                currentModel.traverse(n => {
                    if (n.isObject3D && n.name.startsWith("APEX_NODE_")) {
                        const name = n.name.replace("APEX_NODE_", "");
                        nodeMap.set(name, n);
                        if (!name.startsWith("CPG_") && !name.startsWith("MUSCLE_NODE_") && !name.startsWith("SKIN_HULL_")) {
                            boneCnt++;
                        } else if (name.startsWith("CPG_")) {
                            cpgCnt++;
                        }
                    }
                });

                document.getElementById('boneCount').innerText = boneCnt;
                document.getElementById('nerves').innerText = cpgCnt;

                const sceneData = gltf.scene.userData;
                let muscleCnt = 0;
                let skinCnt = 0;

                if (sceneData && sceneData.links) {
                    sceneData.links.forEach(link => {
                        const sourceNode = nodeMap.get(link.source);
                        const targetNode = nodeMap.get(link.target);
                        
                        if (sourceNode && targetNode) {
                            const sPos = new THREE.Vector3();
                            const tPos = new THREE.Vector3();
                            sourceNode.getWorldPosition(sPos);
                            targetNode.getWorldPosition(tPos);

                            const dir = tPos.clone().sub(sPos);
                            const len = dir.length();
                            
                            if (len > 0) {
                                if (link.type === "skin") {
                                    // Render as volume envelope
                                    const mesh = new THREE.Mesh(baseSphereGeom, skinMat);
                                    mesh.position.copy(tPos); // Hull center
                                    // Scale to represent the volume (simplified)
                                    mesh.scale.set(0.12, 0.12, 0.12);
                                    visualGroup.add(mesh);
                                    skinCnt++;
                                } else {
                                    let mat = boneMat;
                                    let scale = 1;
                                    if (link.type === "muscle") {
                                        mat = muscleMat;
                                        scale = 0.8;
                                        muscleCnt++;
                                    } else if (link.type === "synapse") {
                                        mat = neuralMat;
                                        scale = 0.3;
                                    }

                                    const mesh = new THREE.Mesh(baseCylinderGeom, mat);
                                    mesh.position.copy(sPos);
                                    mesh.scale.set(scale, len, scale);
                                    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
                                    visualGroup.add(mesh);
                                }
                            }
                        }
                    });
                }
                document.getElementById('muscles').innerText = muscleCnt;
                document.getElementById('skin').innerText = skinCnt;

            }, undefined, (e) => {
                document.getElementById('status').innerText = "WAITING";
                document.getElementById('status').style.color = "#ff0";
            });
        }

        loadModel();
        setInterval(loadModel, 2000);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
