<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX Organism Viewer</title>
    <style>
        body { margin: 0; background: #111; overflow: hidden; font-family: monospace; }
        #info { position: absolute; top: 10px; left: 10px; color: #0f0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="info">APEX 3D VIEWER: human_skeleton.glb</div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Setup Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting
        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // 3. Grid Helper
        const gridHelper = new THREE.GridHelper(10, 10, 0x00ff00, 0x444444);
        scene.add(gridHelper);

        // 4. Load APEX Model
        const loader = new GLTFLoader();
        loader.load('../human_skeleton.glb', (gltf) => {
            const model = gltf.scene;
            
            // Visualizing abstract nodes as spheres since GLTF bones are just transforms
            model.traverse((node) => {
                if (node.isObject3D) {
                    const geometry = new THREE.SphereGeometry(0.1);
                    const material = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
                    const mesh = new THREE.Mesh(geometry, material);
                    node.add(mesh);
                    
                    // Simple vertical stacking for skeletal visualization
                    // In real APEX, these positions would come from the initial topology layout
                    node.position.y += 0.5; 
                }
            });

            scene.add(model);
            console.log('APEX Model Loaded:', model);
        }, undefined, (error) => {
            console.error('Error loading APEX model:', error);
        });

        // 5. Controls
        const controls = new OrbitControls(camera, renderer.domElement);

        // 6. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
