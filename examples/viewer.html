<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX Debug Viewer</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: monospace; color: #0f0; }
        #info { 
            position: absolute; top: 10px; left: 10px; z-index: 100; 
            background: rgba(0,0,0,0.9); padding: 10px; border: 1px solid #0f0;
        }
        .err { color: #f00; }
    </style>
</head>
<body>
    <div id="info">
        <b>APEX DEBUG</b><br>
        Bones: <span id="boneCnt">0</span><br>
        Links: <span id="linkCnt">0</span><br>
        Status: <span id="status">INIT</span>
    </div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(1, 1, 2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.GridHelper(4, 20, 0x00ff00, 0x222222));
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        
        const loader = new GLTFLoader();
        const visualGroup = new THREE.Group();
        scene.add(visualGroup);

        const boneMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
        const jointMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
        const sphereGeom = new THREE.SphereGeometry(0.015, 8, 8);
        const cylGeom = new THREE.CylinderGeometry(0.008, 0.008, 1, 6);
        cylGeom.translate(0, 0.5, 0);

        function load() {
            loader.load('../human_skeleton.glb?t=' + Date.now(), (gltf) => {
                visualGroup.clear();
                const nodeMap = new Map();
                let bCount = 0;

                gltf.scene.traverse(n => {
                    if (n.name.startsWith("APEX_NODE_")) {
                        const cleanName = n.name.replace("APEX_NODE_", "");
                        nodeMap.set(cleanName, n);
                        bCount++;

                        const marker = new THREE.Mesh(sphereGeom, jointMat);
                        marker.position.copy(n.position);
                        visualGroup.add(marker);
                    }
                });

                document.getElementById('boneCnt').innerText = bCount;
                
                const links = gltf.scene.userData.links || [];
                document.getElementById('linkCnt').innerText = links.length;

                links.forEach(l => {
                    const s = nodeMap.get(l.source);
                    const t = nodeMap.get(l.target);
                    if (s && t) {
                        const dir = t.position.clone().sub(s.position);
                        const len = dir.length();
                        if (len > 0) {
                            const bone = new THREE.Mesh(cylGeom, boneMat);
                            bone.position.copy(s.position);
                            bone.scale.set(1, len, 1);
                            bone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
                            visualGroup.add(bone);
                        }
                    }
                });

                document.getElementById('status').innerText = "OK";
            }, undefined, e => {
                document.getElementById('status').innerText = "FAIL";
                console.error(e);
            });
        }

        load();
        setInterval(load, 2000);
        const controls = new OrbitControls(camera, renderer.domElement);
        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        animate();
    </script>
</body>
</html>
